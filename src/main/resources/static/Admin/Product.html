<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm - Hoa Giấy Phù Đổng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/Asset/Admin/Admin.css" rel="stylesheet">
</head>
<body>
<div id="AdminNavigation"></div>

<main class="container page-shell py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Quản lý sản phẩm</h1>
            <p class="text-secondary mb-0">CRUD các sản phẩm do nhà vườn gửi đăng bán.</p>
        </div>
        <button class="btn btn-success d-inline-flex align-items-center gap-2" id="AddProductButton" type="button">
            <i class="bi bi-plus-lg"></i>
            <span>Thêm sản phẩm</span>
        </button>
    </div>

    <div id="AlertBox" class="alert d-none" role="alert"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div class="d-flex flex-wrap align-items-end gap-2">
            <div>
                <label class="form-label text-secondary small mb-1" for="ProductKeyword">Tìm kiếm</label>
                <input class="form-control form-control-sm" id="ProductKeyword" type="search" placeholder="Tên, mã, mô tả...">
            </div>
            <div>
                <label class="form-label text-secondary small mb-1" for="ProductCategoryFilter">Danh mục</label>
                <select class="form-select form-select-sm" id="ProductCategoryFilter">
                    <option value="">Tất cả danh mục</option>
                </select>
            </div>
            <div>
                <label class="form-label text-secondary small mb-1" for="ProductInventoryFilter">Tồn kho</label>
                <select class="form-select form-select-sm" id="ProductInventoryFilter">
                    <option value="">Tất cả</option>
                    <option value="AVAILABLE">Còn hàng</option>
                    <option value="OUT_OF_STOCK">Hết hàng</option>
                    <option value="PRE_ORDER">Đặt trước</option>
                </select>
            </div>
            <div>
                <label class="form-label text-secondary small mb-1" for="ProductFeaturedFilter">Nổi bật</label>
                <select class="form-select form-select-sm" id="ProductFeaturedFilter">
                    <option value="">Tất cả</option>
                    <option value="true">Có</option>
                    <option value="false">Không</option>
                </select>
            </div>
            <button class="btn btn-outline-success btn-sm" id="ProductSearchButton" type="button">Tìm</button>
            <button class="btn btn-outline-secondary btn-sm" id="ProductResetButton" type="button">Xóa lọc</button>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="form-label text-secondary small mb-0" for="ProductSort">Sắp xếp</label>
        <select class="form-select form-select-sm w-auto" id="ProductSort">
            <option value="id,desc">ID mới nhất</option>
            <option value="id,asc">ID cũ nhất</option>
            <option value="name,asc">Tên A-Z</option>
            <option value="name,desc">Tên Z-A</option>
            <option value="priceAmount,asc">Giá tăng dần</option>
            <option value="priceAmount,desc">Giá giảm dần</option>
        </select>
        <label class="form-label text-secondary small mb-0" for="ProductSize">Hiển thị</label>
        <select class="form-select form-select-sm w-auto" id="ProductSize">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
        </div>
    </div>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Giá</th>
                        <th>Tồn kho</th>
                        <th>Nổi bật</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="ProductTableBody">
                    <tr><td colspan="7" class="text-center text-secondary py-4">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="border-top px-4 py-3">
                <div id="ProductPagination" class="d-flex flex-wrap justify-content-between align-items-center gap-2"></div>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="ProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h2 class="modal-title h5 fw-bold" id="ProductModalTitle">Thêm sản phẩm</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <form id="ProductForm">
                <div class="modal-body">
                    <input type="hidden" id="ProductId">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-medium" for="Name">Tên sản phẩm</label>
                            <input class="form-control" id="Name" maxlength="180" required type="text">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium" for="Code">Mã sản phẩm</label>
                            <input class="form-control" id="Code" maxlength="40" type="text">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium" for="CategoryId">Danh mục</label>
                            <select class="form-select" id="CategoryId"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium" for="Slug">Slug</label>
                            <input class="form-control" id="Slug" maxlength="220" type="text" placeholder="Bỏ trống để tự tạo">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium" for="ShortDescription">Mô tả ngắn</label>
                            <textarea class="form-control" id="ShortDescription" rows="3"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium" for="PriceAmount">Giá số</label>
                            <input class="form-control" id="PriceAmount" min="0" step="1000" type="number">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium" for="PriceLabel">Nhãn giá</label>
                            <input class="form-control" id="PriceLabel" maxlength="80" type="text" placeholder="Liên hệ">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium" for="InventoryStatus">Tồn kho</label>
                            <select class="form-select" id="InventoryStatus">
                                <option value="AVAILABLE">Còn hàng</option>
                                <option value="OUT_OF_STOCK">Hết hàng</option>
                                <option value="PRE_ORDER">Đặt trước</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium" for="ColorFamily">Nhóm màu</label>
                            <input class="form-control" id="ColorFamily" maxlength="80" type="text">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium" for="HeightCm">Chiều cao cm</label>
                            <input class="form-control" id="HeightCm" min="0" type="number">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium" for="ThumbnailUrl">Ảnh đại diện URL</label>
                            <input class="form-control" id="ThumbnailUrl" maxlength="500" type="url">
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="Featured" role="switch" type="checkbox">
                                <label class="form-check-label" for="Featured">Sản phẩm nổi bật</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu sản phẩm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="admin-footer">
    <div class="container page-shell d-flex flex-wrap justify-content-between gap-2">
        <span>Hoa Giấy Phù Đổng</span>
        <span>Trang quản trị</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Asset/Security/AuthToken.js"></script>
<script src="/Asset/Admin/AdminNavigation.js"></script>
<script src="/Asset/Admin/AdminPagination.js"></script>
<script src="/Asset/Admin/Product.js"></script>
</body>
</html>
