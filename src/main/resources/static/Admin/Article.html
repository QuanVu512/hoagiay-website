<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bài viết - Hoa Giấy Phù Đổng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/Asset/Admin/Admin.css" rel="stylesheet">
</head>
<body>
<div id="AdminNavigation"></div>

<main class="container page-shell py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Quản lý bài viết</h1>
            <p class="text-secondary mb-0">CRUD bài viết chăm sóc hoa giấy và tin tức trên website.</p>
        </div>
        <button class="btn btn-success d-inline-flex align-items-center gap-2" id="AddArticleButton" type="button">
            <i class="bi bi-plus-lg"></i>
            <span>Thêm bài viết</span>
        </button>
    </div>

    <div id="AlertBox" class="alert d-none" role="alert"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div class="d-flex flex-wrap align-items-end gap-2">
            <div>
                <label class="form-label text-secondary small mb-1" for="ArticleKeyword">Tìm kiếm</label>
                <input class="form-control form-control-sm" id="ArticleKeyword" type="search" placeholder="Tiêu đề, slug, nội dung...">
            </div>
            <div>
                <label class="form-label text-secondary small mb-1" for="ArticlePublishedFilter">Trạng thái</label>
                <select class="form-select form-select-sm" id="ArticlePublishedFilter">
                    <option value="">Tất cả</option>
                    <option value="true">Đã xuất bản</option>
                    <option value="false">Bản nháp</option>
                </select>
            </div>
            <button class="btn btn-outline-success btn-sm" id="ArticleSearchButton" type="button">Tìm</button>
            <button class="btn btn-outline-secondary btn-sm" id="ArticleResetButton" type="button">Xóa lọc</button>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="form-label text-secondary small mb-0" for="ArticleSort">Sắp xếp</label>
        <select class="form-select form-select-sm w-auto" id="ArticleSort">
            <option value="id,desc">ID mới nhất</option>
            <option value="id,asc">ID cũ nhất</option>
            <option value="publishedAt,desc;id,desc">Ngày xuất bản mới nhất</option>
            <option value="publishedAt,asc;id,asc">Ngày xuất bản cũ nhất</option>
            <option value="title,asc">Tiêu đề A-Z</option>
        </select>
        <label class="form-label text-secondary small mb-0" for="ArticleSize">Hiển thị</label>
        <select class="form-select form-select-sm w-auto" id="ArticleSize">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
        </div>
    </div>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Tiêu đề</th>
                        <th>Slug</th>
                        <th>Trạng thái</th>
                        <th>Ngày xuất bản</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="ArticleTableBody">
                    <tr><td colspan="6" class="text-center text-secondary py-4">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="border-top px-4 py-3">
                <div id="ArticlePagination" class="d-flex flex-wrap justify-content-between align-items-center gap-2"></div>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="ArticleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h2 class="modal-title h5 fw-bold" id="ArticleModalTitle">Thêm bài viết</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <form id="ArticleForm">
                <div class="modal-body">
                    <input type="hidden" id="ArticleId">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-medium" for="Title">Tiêu đề</label>
                            <input class="form-control" id="Title" maxlength="220" required type="text">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium" for="Slug">Slug</label>
                            <input class="form-control" id="Slug" maxlength="260" type="text" placeholder="Bỏ trống để tự tạo">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium" for="Summary">Tóm tắt</label>
                            <textarea class="form-control" id="Summary" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium" for="Content">Nội dung</label>
                            <textarea class="form-control" id="Content" rows="8"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium" for="ThumbnailUrl">Ảnh đại diện URL</label>
                            <input class="form-control" id="ThumbnailUrl" maxlength="500" type="url">
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="Published" role="switch" type="checkbox">
                                <label class="form-check-label" for="Published">Xuất bản</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu bài viết</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="admin-footer">
    <div class="container page-shell d-flex flex-wrap justify-content-between gap-2">
        <span>Hoa Giấy Phù Đổng</span>
        <span>Trang quản trị</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Asset/Security/AuthToken.js"></script>
<script src="/Asset/Admin/AdminNavigation.js"></script>
<script src="/Asset/Admin/AdminPagination.js"></script>
<script src="/Asset/Admin/Article.js"></script>
</body>
</html>
