<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bộ phận - Hoa Giấy Phù Đổng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/Asset/Admin/Admin.css" rel="stylesheet">
</head>
<body>
<div id="AdminNavigation"></div>

<main class="container page-shell py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Quản lý bộ phận</h1>
            <p class="text-secondary mb-0">Tạo danh sách bộ phận để gán cho hồ sơ nhân viên.</p>
        </div>
        <button class="btn btn-success d-inline-flex align-items-center gap-2" id="AddDepartmentButton" type="button">
            <i class="bi bi-plus-lg"></i>
            <span>Thêm bộ phận</span>
        </button>
    </div>

    <div id="AlertBox" class="alert d-none" role="alert"></div>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Tên bộ phận</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="DepartmentTableBody">
                    <tr><td colspan="5" class="text-center text-secondary py-4">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="DepartmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h2 class="modal-title h5 fw-bold" id="DepartmentModalTitle">Thêm bộ phận</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <form id="DepartmentForm">
                <div class="modal-body">
                    <input type="hidden" id="DepartmentId">
                    <div class="mb-3">
                        <label class="form-label fw-medium" for="Name">Tên bộ phận</label>
                        <input class="form-control" id="Name" maxlength="80" required type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium" for="Description">Mô tả</label>
                        <textarea class="form-control" id="Description" maxlength="255" rows="3"></textarea>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="Active" role="switch" type="checkbox" checked>
                        <label class="form-check-label" for="Active">Đang hoạt động</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu bộ phận</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="admin-footer">
    <div class="container page-shell d-flex flex-wrap justify-content-between gap-2">
        <span>Hoa Giấy Phù Đổng</span>
        <span>Trang quản trị</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Asset/Admin/AdminNavigation.js"></script>
<script src="/Asset/Security/Csrf.js"></script>
<script src="/Asset/Admin/Department.js"></script>
</body>
</html>
