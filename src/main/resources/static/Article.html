<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài viết chăm sóc - Hoa Giấy Phù Đổng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold fs-4" href="/">Hoa Giấy Phù Đổng</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
                <li class="nav-item">
                    <a class="nav-link px-3" href="/">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" href="/products">Sản phẩm</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active px-3" href="/articles">Cách chăm sóc</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" href="/#contact">Liên hệ</a>
                </li>
            </ul>
            <div class="d-flex gap-2" id="GuestActions">
                <a class="btn btn-outline-danger fw-medium px-4" href="/login">Đăng nhập</a>
                <a class="btn btn-danger fw-medium px-4" href="/register">Đăng ký</a>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2 d-none" id="UserActions">
                <span class="fw-semibold text-dark" id="SessionUsername"></span>
                <a class="btn btn-outline-danger fw-medium px-4 d-none" id="AdminLink" href="/admin/account">Quản trị</a>
                <button class="btn btn-danger fw-medium px-4" type="button" onclick="LogoutJwt()">Đăng xuất</button>
            </div>
        </div>
    </div>
</nav>

<main class="py-5">
    <section class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="text-danger fw-bold mb-1 text-uppercase">Kinh nghiệm</p>
                <h1 class="fw-bold mb-2">Bài viết chăm sóc</h1>
                <p class="text-secondary mb-0">Tin tức và hướng dẫn chăm cây được chọn lọc cho khách hàng.</p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <label class="form-label text-secondary small mb-0" for="ArticleSort">Sắp xếp</label>
                <select class="form-select form-select-sm w-auto" id="ArticleSort">
                    <option value="publishedAt,desc;id,desc">Mới nhất</option>
                    <option value="publishedAt,asc;id,asc">Cũ nhất</option>
                    <option value="title,asc">Tiêu đề A-Z</option>
                </select>
                <label class="form-label text-secondary small mb-0" for="ArticleSize">Hiển thị</label>
                <select class="form-select form-select-sm w-auto" id="ArticleSize">
                    <option value="4">4</option>
                    <option value="6" selected>6</option>
                    <option value="12">12</option>
                    <option value="20">20</option>
                </select>
            </div>
        </div>

        <div id="ArticleList" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
        <div id="ArticlePagination" class="d-flex flex-wrap justify-content-center align-items-center gap-3 mt-4"></div>
    </section>
</main>

<footer class="bg-dark text-white py-4 text-center">
    <div class="container">
        <p class="mb-0 text-white-50">&copy; 2026 Hoa Giấy Phù Đổng. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Asset/Security/AuthToken.js"></script>
<script src="/assets/js/SitePagination.js"></script>
<script src="/assets/js/ArticleList.js"></script>
</body>
</html>
