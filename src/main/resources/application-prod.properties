spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cookie.secure=${COOKIE_SECURE:true}

app.security.jwt.base64-secret=${JWT_BASE64_SECRET}
app.security.jwt.validity-in-seconds=${JWT_VALIDITY_IN_SECONDS:3600}
app.security.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_VALIDITY_IN_SECONDS:604800}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
