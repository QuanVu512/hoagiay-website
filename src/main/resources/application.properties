spring.application.name=hoagiayphudong
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=*:missing

app.security.jwt.base64-secret=${JWT_BASE64_SECRET:}
app.security.jwt.validity-in-seconds=${JWT_VALIDITY_IN_SECONDS:3600}
app.security.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_VALIDITY_IN_SECONDS:604800}

app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,X-Request-Id,Accept,Origin
app.cors.exposed-headers=X-Request-Id
app.cors.allow-credentials=true
app.cors.max-age=1800

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
